<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine for Nikita 💖</title>

<style>
body {
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6eb;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.box {
  text-align: center;
}

h1 {
  color: #e6005c;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  margin: 15px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#yes {
  background-color: #ff4d79;
  color: white;
}

#no {
  background-color: #999;
  color: white;
  position: absolute;
}

#gift {
  display: none;
  margin-top: 20px;
}

#gift img {
  width: 260px;
  border-radius: 12px;
}

/* Confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="box">
  <h1>
    Nikita 💖 <br>
    Will you be my Valentine? 🥰
  </h1>

  <button id="yes">Yes 💘</button>
  <button id="no">No 😏</button>

  <div id="gift">
    <h2>You had no choice Nikita 😂💖</h2>
    <img src="https://media.tenor.com/0AVbKGY_MxMAAAAC/happy-valentines-day-love.gif" alt="Valentine Gif">
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const gift = document.getElementById("gift");

/* No button bhagta rahe (mouse + mobile touch) */
function moveNo() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* Confetti */
function confettiBlast() {
  for (let i = 0; i < 80; i++) {
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.style.left = Math.random() * 100 + "vw";
    conf.style.backgroundColor =
      `hsl(${Math.random() * 360},100%,60%)`;
    conf.style.animationDuration =
      Math.random() * 2 + 2 + "s";
    document.body.appendChild(conf);

    setTimeout(() => conf.remove(), 4000);
  }
}

/* Yes click */
yesBtn.addEventListener("click", () => {
  gift.style.display = "block";
  confettiBlast();
});
</script>

</body>
</html>
